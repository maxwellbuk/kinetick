[project]
name = "uvenv"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Imamguliev Pasha", email = "imamgulievpasha@yandex.ru" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.141.1",
    "py-cord>=2.8.1",
    "python-dotenv>=1.2.2",
    "redis>=8.1.0",
    "uvicorn>=0.52.3",
]

[project.scripts]
uvenv = "uvenv:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"
